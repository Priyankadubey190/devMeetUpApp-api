services:
  - type: web_service
    name: devmeetup-api
    env: node
    branch: main
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    env:
      - key: PORT
        value: "8080"
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://meetup-dev.netlify.app
